<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İş Başvurusu — Grosper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=16">
  <script src="../js/theme.js?v=8"></script>
</head>
<body data-page="contact" data-root="../">
  <div id="site-header"></div>
  <script src="../js/layout.js?v=10"></script>
  <main class="page">
    <div class="container">
      <section class="page-hero">
        <h1>İş Başvurusu</h1>
        <p>Ekibimize katılmak için formu doldurun. Başvurunuz insan kaynaklarına iletilir.</p>
      </section>
      <article class="page-card">
        <form class="form" id="job-form">
          <label>Ad Soyad
            <input type="text" name="name" required>
          </label>
          <label>E-posta
            <input type="email" name="email" required>
          </label>
          <label>Telefon
            <input type="tel" name="phone" required>
          </label>
          <label>Pozisyon
            <select name="role" required>
              <option value="">Seçiniz</option>
              <option>Mağaza personeli</option>
              <option>Kasa</option>
              <option>Depo</option>
              <option>Motokurye</option>
              <option>İnsan kaynakları</option>
            </select>
          </label>
          <label>Fotoğraf
            <span class="form-file">
              <span class="form-file__btn">Dosya Seç<input type="file" name="photo" accept="image/*" required hidden></span>
              <span class="form-file__name" data-filename>Dosya seçilmedi</span>
            </span>
            <img class="form-file__preview" id="job-photo-preview" alt="" hidden>
          </label>
          <label>Kısa özgeçmiş
            <textarea name="note" required placeholder="Deneyiminizi kısaca yazın"></textarea>
          </label>
          <button class="btn btn--red" type="submit">Başvuruyu Gönder</button>
          <p class="ok-msg" id="job-ok">Başvurunuz alındı. En kısa sürede dönüş yapacağız.</p>
          <p class="form-error" id="job-error" hidden>Fotoğraf 5 MB’den büyük olamaz.</p>
        </form>
      </article>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../data/cms.js?v=7"></script>
  <script src="../data/inbox.js?v=1"></script>
  <script src="../admin/js/store.js?v=27"></script>
  <script src="../admin/js/files.js?v=9"></script>
  <script src="../js/jobs.js?v=3"></script>
</body>
</html>
