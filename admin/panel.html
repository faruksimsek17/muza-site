<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grosper Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin">
    <aside class="sidebar">
      <img class="sidebar__logo" src="../images/logo.png" alt="Grosper">
      <nav>
        <button type="button" class="nav-link is-active" data-view="dashboard">Özet</button>
        <button type="button" class="nav-link" data-view="sliders">Slider</button>
        <button type="button" class="nav-link" data-view="banners">Blok Banner</button>
        <button type="button" class="nav-link" data-view="news">Haberler</button>
        <button type="button" class="nav-link" data-view="gallery">Öne Çıkan Kategoriler</button>
        <button type="button" class="nav-link" data-view="videos">Videolar</button>
        <button type="button" class="nav-link" data-view="branches">Şubeler</button>
        <button type="button" class="nav-link" data-view="reviews">Yorumlar</button>
        <button type="button" class="nav-link" data-view="jobs">İş Başvuruları</button>
        <button type="button" class="nav-link" data-view="subscribers">Bülten</button>
        <button type="button" class="nav-link" data-view="settings">Ayarlar</button>
      </nav>
      <div class="sidebar__foot">
        <a class="btn btn-ghost" href="../index.html" target="_blank" rel="noreferrer">Siteyi Gör</a>
        <button class="btn btn-danger" type="button" id="logout-btn">Çıkış Yap</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Özet</h1>
          <p class="topbar__meta" id="page-desc">Sitenin güncel içerik özeti</p>
        </div>
        <p class="topbar__meta">Giriş yapan: admin</p>
      </header>
      <section class="content" id="view"></section>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
